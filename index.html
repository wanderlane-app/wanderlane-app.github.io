function chooseTour(id){
  const t=trip(); const r=toursFor(t).find(x=>String(x.id)===String(id)); if(!r) return;
  const had=t.plan.filter(p=>p.fromTour).length, ds=days(t);
  openDlg(`<h2>Маршрут «${esc(r.n)}»</h2><form style="display:grid;gap:12px">
    <p style="margin:0">В «План по дням» добавятся ${r.stops} ${plural(r.stops,"дело","дела","дел")} на ${r.days.length} ${plural(r.days.length,"день","дня","дней")}. Ваши собственные дела останутся.</p>
    ${had?`<label class="chk" style="font-size:14px;color:var(--ink)"><input type="checkbox" name="replace" checked> Убрать дела из ранее выбранного маршрута (${had})</label>`:""}
    <div class="row" style="justify-content:flex-end"><button type="button" data-cancel>Отмена</button><button class="primary" type="submit">${ic("check")}Добавить в план</button></div></form>`,fd=>{
      if(fd.replace) t.plan=t.plan.filter(p=>!p.fromTour);
      const ppl=t.people||1;
      r.days.forEach((d,di)=>{const date=ds.includes(d.date)?d.date:ds[di]; if(!date) return; (d.items||[]).forEach(x=>{ if(x.free) return; t.plan.push({id:uid(),date,time:x.time||"",what:x.name,cost:(x.cost||0)*ppl,done:false,fromTour:String(r.id)});});});
      t.tour=String(r.id); t.tourName=r.n; changed(); toast("Маршрут добавлен в план"); tab="plan"; render();
    },r.c||"var(--grape)");
}
async function runTours(){
  const t=trip(), dest=destCity(t); if(!dest){alertBox("Сначала укажите город поездки.");return;} if(!sampler||busy.tours) return;
  const ds=days(t); if(!ds.length){alertBox("Сначала укажите даты поездки.");return;}
  const useDs=ds.slice(0,10);
  busy.tours=true; render();
  const p=`Поездка: город ${dest}; даты ${useDs.join(", ")} (сезон: ${season(t)}); путешественников: ${t.people||1}; интересы: ${(t.interests||[]).join(", ")||"не указаны"}.
Составь 3 разных готовых туристических маршрута на эти дни: классический, гастрономический и активный (или с детьми, если это в интересах). В каждом дне 3–5 пунктов в логичном порядке, места рядом друг с другом, обед или ужин в реально существующем ресторане. В первый и последний день меньше пунктов. Только реально существующие места с точными названиями.
Для каждого маршрута: name (до 5 слов), d (описание, до 16 слов), pace (Спокойный, Насыщенный или Активный), days: [{date:"ГГГГ-ММ-ДД", items:[{time:"ЧЧ:ММ", name, kind (одно из: ${KINDS.join(", ")}), cost (примерно рублей на человека, 0 если бесплатно), km (для прогулок, иначе 0)}]}].
Ответь только JSON без пояснений: {"tours":[...]}`;
  try{
    const r=await Promise.race([sampler.json(p,{modelTier:"default"}),new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),90000))]);
    const tours=(r&&r.tours)||[];
    t.ideas=t.ideas||{};
    t.ideas.tours=tours.slice(0,3).map((x,i)=>({id:"ai"+i,n:String(x.name||"Маршрут"),d:String(x.d||""),pace:String(x.pace||""),ic:["sparkles","utensils-crossed","party-popper"][i]||"sparkles",c:["var(--grape)","var(--coral)","var(--berry)"][i],
      days:(Array.isArray(x.days)?x.days:[]).map((d,di)=>({date:useDs.includes(String(d.date))?String(d.date):(useDs[di]||""),items:(Array.isArray(d.items)?d.items:[]).filter(y=>y&&y.name).map(y=>({time:String(y.time||""),name:String(y.name),kind:String(y.kind||"city"),cost:+y.cost||0,km:+y.km||0,what:""}))})).filter(d=>d.date&&d.items.length)}))
      .map(x=>({...x,stops:x.days.reduce((a,d)=>a+d.items.length,0),km:x.days.reduce((a,d)=>a+d.items.reduce((b,y)=>b+y.km,0),0),cost:x.days.reduce((a,d)=>a+d.items.reduce((b,y)=>b+y.cost,0),0)})).filter(x=>x.stops);
    busy.tours=false; changed();
    if(!t.ideas.tours.length) alertBox("Claude не смог составить маршруты для этого города. Попробуйте ещё раз или выберите общий план.");
    else toast("Маршруты готовы");
  }catch(e){busy.tours=false; render(); alertBox(e&&e.code==="timeout"?"Составление заняло слишком много времени. Попробуйте ещё раз.":e&&e.code==="rate_limited"?"Слишком много запросов подряд. Попробуйте через минуту.":e&&e.code==="not_granted"?"Нет разрешения на подбор через Claude. Общие маршруты по-прежнему доступны.":"Не получилось составить маршрут. Попробуйте ещё раз.");}
}

});

let assetsNs=null;
const pkey=(dest,name)=>ck(dest)+"|"+ck(name);
function photoOf(dest,name){const t=trip(); const v=t.photos&&t.photos[pkey(dest,name)]; if(!v) return ""; return v.startsWith("data:")?v:"/_blob/"+v;}
function photoBox(kind,dest,name,dish){
  const p=photoOf(dest,name);
  const w=!p&&webPh(name,dest,dish), cw=!p&&!w&&cityPh(dest); const img=p?`<img class="pc-photo" src="${esc(p)}" alt="${esc(name)}" loading="lazy">`:w?phImg(w,name):cw?phImg(cw,name,"Вид города"):cover(kind,name);
  return img+`<button class="pc-cam" data-photo="${esc(dest)}|${esc(name)}" title="${p?"Заменить фото":"Добавить своё фото"}" aria-label="${p?"Заменить фото":"Добавить своё фото"}">${ic("camera")}</button>${p?`<button class="pc-cam rm" data-unphoto="${esc(dest)}|${esc(name)}" title="Убрать фото" aria-label="Убрать фото">×</button>`:""}`;
}
function shrink(file,maxW,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,maxW/im.width);const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res({blob:b,url:c.toDataURL("image/jpeg",q)}):rej(),"image/jpeg",q);};im.src=fr.result;};fr.readAsDataURL(file);});}
function pickPhoto(dest,name){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.style.display="none"; document.body.appendChild(inp);
  inp.onchange=async()=>{const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return; const t=trip(); t.photos=t.photos||{};
    try{
      if(assetsNs){const {blob}=await shrink(f,1400,.85); const r=await assetsNs.upload(new File([blob],"photo.jpg",{type:"image/jpeg"})); t.photos[pkey(dest,name)]=r.id;}
      else{const inline=Object.values(t.photos).filter(v=>String(v).startsWith("data:")).length; if(inline>=4){alertBox("Без облачного хранилища можно добавить до 4 фото на поездку. Удалите одно из старых фото.");return;} const {url}=await shrink(f,560,.7); t.photos[pkey(dest,name)]=url;}
      changed(); toast("Фото добавлено");
    }catch(e){alertBox(e&&e.code==="quota_exceeded"?"Хранилище фото заполнено.":"Не получилось загрузить фото. Попробуйте другое изображение.");}
  };
  inp.click();
}
document.addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.photo){const k=b.dataset.photo.split("|"); pickPhoto(k[0],k.slice(1).join("|")); return;}
  if(b.dataset.unphoto){const k=b.dataset.unphoto.split("|"); const t=trip(); if(t.photos){delete t.photos[pkey(k[0],k.slice(1).join("|"))]; changed();} return;}
});

async function shPrep(sid){ if(shK[sid]) return shK[sid];

function subscribeShared0(t){

let MV=null, mapDay="all", mapSel=null, placing=null, mapTripKey="";
function mapPoints(t){
  const city=ck(destCity(t)); const out=[];
  t.stays.forEach(s=>{const g=s.geo||geoFor(t,s.name)||(s.addr&&geoFor(t,s.addr)); out.push({type:"stay",id:s.id,name:s.name,sub:s.addr||"Жильё",g,stay:s});});
  const ds=days(t);
  [...t.plan].sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))).forEach(p=>{
    const di=ds.indexOf(p.date); out.push({type:"plan",id:p.id,name:p.what,sub:(di>=0?"День "+(di+1)+" · ":"")+(p.time||""),date:p.date,day:di,done:!!p.done,g:geoFor(t,p.what),plan:p});});
  return out;
}
function projector(lat0){const k=Math.cos(lat0*Math.PI/180); return {x:lng=>lng*k*111.32, y:lat=>-lat*110.57, lng:x=>x/(k*111.32), lat:y=>-y/110.57};}
function fitView(pts,t){
  const g=pts.map(p=>p.g).filter(Boolean); let c=CITYCENTER[ck(destCity(t))];
  if(!g.length){ c=c||[55.75,37.62]; const P=projector(c[0]); return {P,cx:P.x(c[1]),cy:P.y(c[0]),w:6};}
  const lat0=g.reduce((a,x)=>a+x[0],0)/g.length, P=projector(lat0);
  let xs=g.map(x=>P.x(x[1])), ys=g.map(x=>P.y(x[0]));
  if(xs.length>=4){const med=a=>[...a].sort((p,q)=>p-q)[Math.floor(a.length/2)]; const mx=med(xs), my=med(ys); const ds2=xs.map((x,i)=>Math.hypot(x-mx,ys[i]-my)); const md=Math.max(0.4,med(ds2)); const keep=ds2.map(d=>d<=md*4); if(keep.filter(Boolean).length>=3){xs=xs.filter((_,i)=>keep[i]); ys=ys.filter((_,i)=>keep[i]);}}
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const w=Math.max(1.2,(maxx-minx)*1.35,(maxy-miny)*1.35*1.6);
  return {P,cx:(minx+maxx)/2,cy:(miny+maxy)/2,w};
}

function drawMap(){
  const svg=$("#mapsvg"), box=$("#map"); if(!svg||!box) return;
  const t=trip(), W=box.clientWidth||600, H=box.clientHeight||420; svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

  const pts=mapPoints(t).filter(p=>p.g&&(p.type==="stay"||mapDay==="all"||p.date===mapDay));
  // сетка
  const steps=[0.1,0.25,0.5,1,2,5,10,20,50]; const step=steps.find(s=>s*sc>=70)||50;
  let grid="";
  const x0=MV.cx-W/2/sc, y0=MV.cy-H/2/sc;
  for(let gx=Math.floor(x0/step)*step; gx<x0+W/sc; gx+=step){const px=(gx-MV.cx)*sc+W/2; grid+=`<line x1="${px}" y1="0" x2="${px}" y2="${H}"/>`;}
  for(let gy=Math.floor(y0/step)*step; gy<y0+H/sc; gy+=step){const py=(gy-MV.cy)*sc+H/2; grid+=`<line x1="0" y1="${py}" x2="${W}" y2="${py}"/>`;}
  // декоративные «кварталы»
  let blocks=""; const rs=hsh(ck(destCity(t))); const R=(n)=>{let x=(rs+n*7919)>>>0; x^=x<<13;x^=x>>>17;x^=x<<5; return ((x>>>0)%1000)/1000;};
  for(let i=0;i<26;i++){const bx=MV.cx+(R(i)-.5)*MV.w*2.2, by=MV.cy+(R(i+50)-.5)*MV.w*1.6; const px=(bx-MV.cx)*sc+W/2, py=(by-MV.cy)*sc+H/2; const r=(0.15+R(i+99)*0.5)*sc; blocks+=`<ellipse cx="${px}" cy="${py}" rx="${r}" ry="${r*.7}" class="${i%4===0?"park":"blk"}"/>`;}
  // линии маршрута по дням
  const ds=days(t), hotel=pts.find(p=>p.type==="stay");
  let routes="";
  ds.forEach((d,di)=>{ if(mapDay!=="all"&&mapDay!==d) return;
    const dayPts=pts.filter(p=>p.type==="plan"&&p.date===d); if(!dayPts.length) return;
    const seq=(hotel?[hotel]:[]).concat(dayPts);
    for(let i=1;i<seq.length;i++){const a=seq[i-1],b=seq[i]; const ax=X(a.g[1]),ay=Y(a.g[0]),bx=X(b.g[1]),by=Y(b.g[0]); const mx=(ax+bx)/2+(ay-by)*.12, my=(ay+by)/2+(bx-ax)*.12;

  let marks="";
  pts.sort((a,b)=>(a.type==="stay")-(b.type==="stay")).forEach(p=>{

    const sel=mapSel===p.id?" sel":"";

    else{const st=p.done?"done":p.id===nextId?"next":"todo"; const col=p.day>=0?DAYC[p.day%DAYC.length]:"var(--teal)";
      marks+=`<g class="mk ${st}${sel}" data-mk="${p.id}" transform="translate(${px} ${py})" tabindex="0" role="button" aria-label="${esc(p.name)}" style="--dc:${col}">${st==="next"?'<circle r="20" class="ring"/>':""}<circle r="13" class="dot"/>${p.done?'<path d="M-5 0 l3.5 3.5 l6.5 -7" class="chk"/>':`<text y="4.5" text-anchor="middle">${order[p.id]}</text>`}</g>`;}

   <rect width="${W}" height="${H}" fill="url(#mland)"/><text x="${W/2}" y="${H/2}" text-anchor="middle" class="cityw">${esc(destCity(t))}</text><g class="blocks">${blocks}</g><g class="grid">${grid}</g><g class="routes">${routes}</g><g class="marks">${marks}</g>
   <g transform="translate(${W-46} 46)" class="compass"><circle r="20"/><path d="M0 -15 L5 0 L0 15 L-5 0Z"/><path d="M0 -15 L5 0 L-5 0Z" class="n"/><text y="-22" text-anchor="middle">С</text></g>
   <g transform="translate(16 ${H-18})" class="scale"><rect width="${sb}" height="5" rx="2"/><text x="${sb+8}" y="6">${sl}</text></g>`;

function mapZoom(f,cx,cy){const box=$("#map"); if(!box) return; const W=box.clientWidth,H=box.clientHeight, sc=W/MV.w; if(cx!=null){const kx=MV.cx+(cx-W/2)/sc, ky=MV.cy+(cy-H/2)/sc; MV.w=Math.min(400,Math.max(0.15,MV.w/f)); const sc2=W/MV.w; MV.cx=kx-(cx-W/2)/sc2; MV.cy=ky-(cy-H/2)/sc2;} else MV.w=Math.min(400,Math.max(0.15,MV.w/f)); drawMap();}

async function geoAI(){
  const t=trip(), dest=destCity(t); if(!sampler||busy.geo||!dest) return;
  const un=mapPoints(t).filter(p=>!p.g); if(!un.length) return;
  busy.geo=true; render();
  const list=un.map(p=>p.type==="stay"?(p.name+(p.stay.addr?" ("+p.stay.addr+")":"")):placeKey(p.name));
  try{
    const r=await sampler.json(`Город: ${dest}. Для каждого места из списка дай примерные географические координаты (широта и долгота, 4 знака после запятой). Если место не найти, пропусти его. Список: ${JSON.stringify(list)}. Ответь только JSON: {"items":[{"name":"как в списке","lat":0,"lng":0}]}`,{modelTier:"default"});
    t.ideas=t.ideas||{}; t.ideas.geo=t.ideas.geo||{};
    (r.items||[]).forEach(x=>{ if(!(+x.lat)||!(+x.lng)) return; const i=list.findIndex(n=>ck(n)===ck(x.name)); const p=i>=0?un[i]:null; const g=[+x.lat,+x.lng];
      if(p&&p.type==="stay"){const s=t.stays.find(z=>z.id===p.id); if(s) s.geo=g;} else t.ideas.geo[ck(placeKey(x.name))]=g; });
    busy.geo=false; MV=null; changed(); toast("Координаты найдены, проверьте точки на карте");
  }catch(e){busy.geo=false; render(); alertBox("Не получилось найти координаты. Поставьте точки вручную.");}
}

const icsD=s=>s.replace(/[-:]/g,"").slice(0,13)+"00";
const icsEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
function addHours(dt,h){const d=new Date(dt); d.setMinutes(d.getMinutes()+h*60); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function buildICS(t,withPlan){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Moi poezdki//RU","CALSCALE:GREGORIAN"]; const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";

  t.legs.forEach(l=>{ if(!l.dep) return; const end=l.arr&&l.arr>l.dep?l.arr:addHours(l.dep,1);
    ev(l.id,l.dep,end,`${TYPES[l.type]}: ${l.from} → ${l.to}${l.code?" ("+l.code+")":""}`,`Бронь: ${l.ref||"—"}${l.note?"\n"+l.note:""}`,[[l.type==="plane"?180:90,"Пора выезжать: "+l.from+" → "+l.to]]);
    if(l.type==="plane") ev(l.id+"-ci",addHours(l.dep,-24),addHours(l.dep,-23.5),`Онлайн-регистрация: ${l.from} → ${l.to}`,"Откройте регистрацию на рейс "+(l.code||""),[[0,"Открылась онлайн-регистрация на рейс"]]); });
  t.stays.forEach(s=>{ if(!s.in) return; ev(s.id,s.in+"T14:00",s.in+"T15:00","Заселение: "+s.name,(s.addr||"")+(s.ref?"\nБронь: "+s.ref:""),[[120,"Сегодня заселение: "+s.name]]); if(s.out) ev(s.id+"-out",s.out+"T11:00",s.out+"T12:00","Выезд из жилья: "+s.name,"",[[60,"Скоро выезд из жилья"]]); });
  if(withPlan) t.plan.forEach(p=>{ if(!p.date) return; const st=p.date+"T"+(p.time||"10:00"); ev(p.id,st,addHours(st,1),p.what,"",[[30,p.what]]); });

}

let chatBusy=false;
const CHIPS=["Что поделать вечером рядом с отелем?","Где недорого и вкусно поужинать?","Чем заняться, если пойдёт дождь?","Составь план на свободный день","Что попробовать из местной еды?","Как добраться из аэропорта до отеля?"];
function tripContext(t){
  const ds=days(t), T=totals(t);
  const legs=[...t.legs].sort((a,b)=>(a.dep||"").localeCompare(b.dep||"")).map(l=>`${TYPES[l.type]} ${l.from} → ${l.to}, ${l.dep||""}`).join("; ");
  const stays=t.stays.map(s=>`${s.name}${s.addr?" ("+s.addr+")":""}, ${s.in}–${s.out}`).join("; ");
  const plan=ds.map((d,i)=>{const it=t.plan.filter(p=>p.date===d).sort((a,b)=>(a.time||"").localeCompare(b.time||"")).map(p=>`${p.time||""} ${p.what}${p.done?" (посещено)":""}`).join(", "); return `День ${i+1} (${d}): ${it||"свободно"}`;}).join("\n");
  return `Город поездки: ${destCity(t)||"не указан"}. Откуда: ${homeCity(t)||"не указано"}. Даты: ${t.start} – ${t.end}, сезон: ${season(t)}. Путешественников: ${t.people||1}. Интересы: ${(t.interests||[]).join(", ")||"не указаны"}.
Бюджет: ${t.budget||0} ₽, запланировано ${Math.round(T.total)} ₽.
Переезды: ${legs||"нет"}.
Жильё: ${stays||"не указано"}.
План:
${plan}`;
}
function fmtMsg(txt){
  const lines=esc(txt).split("\n"); let out="", inList=false;
  lines.forEach(l=>{const m=l.match(/^\s*[-•*]\s+(.*)/); if(m){ if(!inList){out+="<ul>"; inList=true;} out+=`<li>${m[1]}</li>`; } else { if(inList){out+="</ul>"; inList=false;} if(l.trim()) out+=`<p>${l}</p>`; }});
  if(inList) out+="</ul>";
  return out.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
}
function vChat(t){
  const msgs=t.chat||[], ai=!!sampler, ds=days(t);
  return `<div class="card chat" style="--c:var(--grape)">
    ${!ai?`<div class="alert warn">${ic("alert")}<span>Помощник отвечает, когда приложение открыто в Claude. Сейчас он недоступен.</span></div>`:""}
    <div class="msgs" id="msgs">

      ${msgs.map((m,mi)=>m.role==="user"?`<div class="msg me"><div class="mtx"><p>${esc(m.text)}</p></div></div>`:`<div class="msg bot"><span class="mav">${ic("sparkles")}</span><div class="mtx">${fmtMsg(m.text)}${(m.items||[]).length?`<div class="sugs">${m.items.map((x,xi)=>`<div class="sugi"><div><b>${esc(x.name)}</b><small class="muted">${x.date&&ds.includes(x.date)?fmtD(x.date):""}${x.time?" · "+esc(x.time):""}${x.cost?" · ~"+rub(x.cost):""}</small></div>${x.added?`<span class="pill paid">${ic("check")}В плане</span>`:`<button class="primary" data-chatadd="${mi}:${xi}">${ic("plus")}В план</button>`}</div>`).join("")}</div>`:""}</div></div>`).join("")}
      ${chatBusy?`<div class="msg bot"><span class="mav">${ic("sparkles")}</span><div class="mtx typing"><i></i><i></i><i></i></div></div>`:""}
    </div>

    <form id="chatForm" class="chatform"><label for="chatIn" class="sr">Ваш вопрос</label><textarea id="chatIn" rows="1" placeholder="Спросите что угодно о поездке…" ${!ai?"disabled":""}></textarea>${micBtn("chat")}<button type="submit" class="primary" ${!ai||chatBusy?"disabled":""} aria-label="Отправить">${ic("send")}</button></form>

async function ask(q){
  const t=trip(); q=String(q||"").trim(); if(!q||!sampler||chatBusy) return;
  t.chat=t.chat||[]; t.chat.push({role:"user",text:q}); chatBusy=true; changed(); scrollChat();
  const ds=days(t);
  const sys=`Ты помощник в приложении-планировщике путешествий. Отвечай по-русски, дружелюбно и коротко (до 120 слов), по делу. Учитывай данные поездки ниже. Называй только реально существующие места с точными названиями. Если предлагаешь конкретные места или дела, добавь их в items (до 5), чтобы человек мог добавить их в план: name (название), date (один из дней: ${ds.join(", ")}), time (ЧЧ:ММ), cost (примерно рублей на человека, 0 если бесплатно). Если мест не предлагаешь, items пустой.
Ответь только JSON: {"answer":"текст ответа, списки через строки с «- »","items":[...]}

Данные поездки:
${tripContext(t)}`;
  const prev=t.chat.slice(0,-1).slice(-8).map(m=>({role:m.role==="user"?"user":"assistant",content:m.role==="user"?m.text:JSON.stringify({answer:m.text,items:m.items||[]})}));
  while(prev.length&&prev[0].role!=="user") prev.shift();
  const hist=[]; prev.forEach(m=>{ if(hist.length&&hist[hist.length-1].role===m.role) hist[hist.length-1]=m; else hist.push(m); });
  if(hist.length&&hist[hist.length-1].role==="user") hist.pop();
  hist.push({role:"user",content:sys+"\n\nВопрос: "+q});
  try{
    const r=await sampler.json(hist,{modelTier:"default"});
    const items=(r.items||[]).filter(x=>x&&x.name).slice(0,5).map(x=>({name:String(x.name),date:ds.includes(x.date)?x.date:(ds[0]||""),time:String(x.time||""),cost:+x.cost||0}));
    t.chat.push({role:"bot",text:String(r.answer||"Не получилось ответить, попробуйте переформулировать вопрос."),items});
  }catch(e){ t.chat.push({role:"bot",text:e&&e.code==="rate_limited"?"Слишком много вопросов подряд. Подождите минуту и спросите ещё раз.":"Не получилось ответить. Попробуйте ещё раз.",items:[]}); }
  if(t.chat.length>40) t.chat=t.chat.slice(-40);
  chatBusy=false; changed(); scrollChat();
}
function scrollChat(){setTimeout(()=>{const m=$("#msgs"); if(m) m.scrollTop=m.scrollHeight;},30);}
document.addEventListener("submit",e=>{if(e.target.id!=="chatForm") return; e.preventDefault(); e.stopImmediatePropagation(); const v=$("#chatIn").value; ask(v);},true);
document.addEventListener("keydown",e=>{if(e.target.id==="chatIn"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault(); ask(e.target.value);}});
document.addEventListener("input",e=>{if(e.target.id==="chatIn"){e.target.style.height="auto"; e.target.style.height=Math.min(140,e.target.scrollHeight)+"px";}});
document.addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; const t=trip();

function filesOf(t,ref){ if(ref==="trip") return (t.tripFiles=t.tripFiles||[]); const [k,id]=ref.split(":"); const it=(t[k]||[]).find(x=>x.id===id); if(!it) return null; return (it.files=it.files||[]); }
function refTitle(t,ref){ if(ref==="trip") return "Документы поездки"; const [k,id]=ref.split(":"); const it=(t[k]||[]).find(x=>x.id===id); if(!it) return ""; return k==="legs"?`${TYPES[it.type]}: ${it.from} → ${it.to}`:it.name; }
const fsize=n=>n>1048576?(n/1048576).toFixed(1).replace(".",",")+" МБ":Math.max(1,Math.round(n/1024))+" КБ";
const ficon=f=>/pdf/.test(f.type)?"file-text":/image/.test(f.type)?"image":"file";
function fileRow(f,ref,i){return `<div class="frow"><span class="fic">${ic(ficon(f))}</span><a href="/_blob/${esc(f.id)}" target="_blank" rel="noopener" class="fnm"><b>${esc(f.name)}</b><small class="muted">${fsize(f.size||0)}${f.kind?" · "+esc(f.kind):""}</small></a><a class="lnk" style="--c:var(--sky)" href="/_blob/${esc(f.id)}" target="_blank" rel="noopener">Открыть ↗</a><button class="ghost" data-fdel="${esc(ref)}|${i}" aria-label="Удалить файл">×</button></div>`;}
const KINDS_F=["Билет","Бронь","Ваучер","Страховка","Виза","Паспорт (копия)","Другое"];
function filesDlg(ref){
  const t=trip(); const list=filesOf(t,ref); if(!list) return;
  openDlg(`<h2>${ic("paperclip")} Файлы</h2><form style="display:grid;gap:12px"><p class="muted" style="margin:0">${esc(refTitle(t,ref))}</p>
    <div id="flist" class="flist">${list.length?list.map((f,i)=>fileRow(f,ref,i)).join(""):`<p class="muted" style="margin:0">Пока нет файлов. Добавьте электронный билет, бронь отеля или страховку, чтобы в поездке всё было под рукой.</p>`}</div>

     <div class="drop" id="drop" tabindex="0">${ic("upload")}<span><b>Выберите файл</b> или перетащите сюда</span><small class="muted">PDF или фото, до 20 МБ</small></div><p class="muted" style="margin:0;font-size:12px">Файлы видите только вы${t.sharedId?" и участники этой общей поездки":""}. Крестик удаляет файл насовсем.</p>`:`<div class="alert warn">${ic("alert")}<span>Загружать файлы можно, когда вы вошли в аккаунт Claude с правом редактирования этого приложения.</span></div>`}
    <div class="row" style="justify-content:flex-end"><button type="button" data-cancel class="primary">Готово</button></div></form>`,()=>{},"var(--sky)");
  const drop=$("#drop"); if(!drop) return;

  drop.ondrop=e=>{e.preventDefault(); drop.classList.remove("over"); const f=e.dataTransfer.files[0]; if(f) upFile(ref,f);};

const CLANG={tr:"tr",ae:"ar",eg:"ar",th:"th",cn:"zh",vn:"vi",ge:"ka",am:"hy",id:"id",mv:"en",in:"en",kr:"en",jp:"en",az:"en",uz:"en",kz:"en",kg:"en",by:"en"};
let ttsNs=null, speakingKey=null, phrLang=null;
function vPhrases(t){
  const c=CITYCOUNTRY[ck(destCity(t))]; const def=c?CLANG[c]:"en";
  const L=phrLang&&PHR[phrLang]?phrLang:def; const P=PHR[L];
  const rows=[...P.p.map((x,i)=>[x[0],x[1],PHR_RU[i]]),...(P.extra||[])];
  return `<div class="card accent" style="--c:var(--sky)">
    <div class="row spread"><h2 class="hic">${ic("languages")}${P.n} язык</h2>${!c?`<span class="muted" style="font-size:13px">Для поездки по России разговорник не нужен, но английский пригодится</span>`:""}</div>
    <div class="chips">${Object.entries(PHR).map(([k,v])=>`<button type="button" class="chip ${k===L?"on":""}" style="--c:var(--sky)" data-plang="${k}" aria-pressed="${k===L}">${v.n}</button>`).join("")}</div>
    ${ttsNs?`<p class="muted" style="margin:0;font-size:13px">Нажмите на динамик, чтобы услышать произношение.</p>`:`<p class="muted" style="margin:0;font-size:13px">Озвучка работает в Claude в браузере на компьютере. Здесь читайте подсказку произношения под каждой фразой.</p>`}
  </div>
  <div class="phr">${rows.map((r,i)=>`<div class="phi ${speakingKey===L+i?"speaking":""}" style="--i:${i}"><div class="phr-ru">${esc(r[2])}</div><div class="phr-or" lang="${L}" dir="${L==="ar"?"rtl":"auto"}">${esc(r[0])}</div><div class="phr-tr">${esc(r[1])}</div>${ttsNs?`<button class="spk" data-say="${L}:${i}" aria-label="Произнести: ${esc(r[2])}">${ic(speakingKey===L+i?"volume-2":"volume-1")}<span class="wave"><i></i><i></i><i></i></span></button>`:""}</div>`).join("")}</div>
  ${ttsNs?`<div class="row"><button id="sayAll" style="--c:var(--sky)">${ic("play")}Прослушать все фразы</button>${speakingKey?`<button id="sayStop">${ic("square")}Стоп</button>`:""}</div>`:""}`;
}
async function sayPhrase(L,i){
  if(!ttsNs) return; const P=PHR[L]; const rows=[...P.p,...(P.extra||[])]; const r=rows[i]; if(!r) return;
  speakingKey=L+i; render();
  try{ await ttsNs.speak(r[0],{language:L,rate:0.85}); }catch(e){ if(e&&e.code==="not_granted"){ttsNs=null;} else if(e&&e.code==="rate_limited") toast("Подождите немного и попробуйте снова"); }
  if(speakingKey===L+i){speakingKey=null; render();}
}
async function sayAll(L){
  if(!ttsNs) return; const P=PHR[L]; const rows=[...P.p.map((x,i)=>[x[0],PHR_RU[i]]),...(P.extra||[]).map(x=>[x[0],x[2]])];
  const lines=[]; rows.forEach(([o,ru])=>{lines.push({text:ru,language:"ru",voice:"airy"}); lines.push({text:o,language:L,rate:0.85});});
  speakingKey="all"; render();
  try{ await ttsNs.speak(lines.slice(0,100)); }catch(e){}
  speakingKey=null; render();
}
document.addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.plang){phrLang=b.dataset.plang; render(); return;}
  if(b.dataset.say){const [L,i]=b.dataset.say.split(":"); sayPhrase(L,+i); return;}
  if(b.id==="sayAll"){const t=trip(); const c=CITYCOUNTRY[ck(destCity(t))]; sayAll(phrLang&&PHR[phrLang]?phrLang:(c?CLANG[c]:"en")); return;}
  if(b.id==="sayStop"&&ttsNs){ttsNs.stop().catch(()=>{}); speakingKey=null; render();}
});

(function(){
  const fine=window.matchMedia("(hover:hover) and (pointer:fine)").matches, calm=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(!fine||calm) return;
  let cur=null, raf=0;
  document.addEventListener("pointermove",e=>{
    const el=e.target.closest&&e.target.closest(".pc,.tour,.stat,.phi,.ms");
    if(cur&&cur!==el){cur.style.removeProperty("--rx"); cur.style.removeProperty("--ry"); cur=null;}
    if(el){ cur=el; const r=el.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5; const k=el.matches(".stat,.ms")?6:9;
      cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{el.style.setProperty("--rx",(-y*k).toFixed(2)+"deg"); el.style.setProperty("--ry",(x*k).toFixed(2)+"deg");}); }
    const h=document.querySelector(".hero"); if(h){ const r=h.getBoundingClientRect(); if(e.clientY<r.bottom+200){ const x=(e.clientX/innerWidth-.5), y=(e.clientY/innerHeight-.5);
      h.style.setProperty("--px1",(x*-18)+"px"); h.style.setProperty("--py1",(y*-12)+"px"); h.style.setProperty("--px2",(x*26)+"px"); h.style.setProperty("--py2",(y*18)+"px"); h.style.setProperty("--px3",(x*40)+"px"); h.style.setProperty("--py3",(y*26)+"px"); } }
  },{passive:true});
  document.addEventListener("pointerleave",()=>{ if(cur){cur.style.removeProperty("--rx"); cur.style.removeProperty("--ry"); cur=null;} });
})();

const todayS=()=>{const d=new Date(),p=x=>String(x).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};

    add("cash","Обменять валюту"+(localCur(t)?" ("+localCur(t)+")":""),addDays(st,-5),"banknote","Немного наличных на первые дни");
    add("sim","Подключить роуминг или eSIM",addDays(st,-3),"smartphone","Чтобы связь была сразу после прилёта");

function relDay(due){const d=Math.round((D(due)-D(todayS()))/864e5); return d===0?"сегодня":d===1?"завтра":d===-1?"вчера":d<0?`${-d} ${plural(-d,"день","дня","дней")} назад`:`через ${d} ${plural(d,"день","дня","дней")}`;}
function prepGroups(t){
  const done=t.prepDone||{}, ts=todayS(), L=prepTasks(t);
  const g={late:[],today:[],soon:[],later:[],done:[]};
  L.forEach(x=>{ if(done[x.key]) g.done.push(x); else if(x.due<ts) g.late.push(x); else if(x.due===ts) g.today.push(x); else if((D(x.due)-D(ts))/864e5<=7) g.soon.push(x); else g.later.push(x); });

let dict=null, vstate={on:false,text:"",partial:"",target:null};
function micBtn(target){return dict?`<button type="button" class="mic ${vstate.on&&vstate.target===target?"on":""}" data-mic="${target}" aria-label="Сказать голосом">${ic("mic")}<span class="rip"></span></button>`:"";}
function voiceOverlay(){

  el.innerHTML=`<div class="vbox"><div class="vorb"><i></i><i></i><i></i>${ic("mic")}</div><p class="vtxt">${esc((vstate.text+" "+vstate.partial).trim())||"Говорите… Например: «завтра в 19:00 ужин в ресторане у набережной»"}</p><div class="row" style="justify-content:center"><button data-vstop="0">Отмена</button><button class="primary" data-vstop="1">${ic("check")}Готово</button></div></div>`;

function startVoice(target){
  if(!dict) return; vstate={on:true,text:"",partial:"",target};
  const p=dict.start(); if(target==="plan") voiceOverlay(); else render();
  p&&p.catch&&p.catch(e=>{vstate.on=false; closeVov(); if(e&&e.code==="not_granted"){dict=null; toast("Микрофон не разрешён");} render();});
}
function closeVov(){const el=$("#vov"); if(el){el.classList.remove("on"); setTimeout(()=>el.remove(),300);}}
async function stopVoice(apply){
  if(!dict) return; try{await dict.stop();}catch(e){} const txt=(vstate.text+" "+vstate.partial).trim(); const target=vstate.target; vstate.on=false; closeVov();
  if(!apply||!txt){render(); return;}
  if(target==="chat"){const ta=$("#chatIn"); render(); setTimeout(()=>{const t2=$("#chatIn"); if(t2){t2.value=txt; t2.focus();}},30); return;}
  parseVoice(txt);
}
function quickParse(t,txt){
  const ds=days(t), s=txt.toLowerCase(); let date=ds[0]||todayS();
  const m=s.match(/день\s*(\d+)/); if(m&&ds[+m[1]-1]) date=ds[+m[1]-1];
  else if(/послезавтра/.test(s)) date=addDays(todayS(),2); else if(/завтра/.test(s)) date=addDays(todayS(),1); else if(/сегодня/.test(s)) date=todayS();
  if(ds.length&&!ds.includes(date)) date=ds[0];
  const tm=s.match(/(\d{1,2})[:.\s](\d{2})/)||s.match(/в\s(\d{1,2})\s?(час|ч|утра|вечера|дня)?/); let time="";
  if(tm){let h=+tm[1]; if(/вечера|дня/.test(tm[0])&&h<12) h+=12; time=String(h).padStart(2,"0")+":"+(tm[2]&&/\d/.test(tm[2])?tm[2]:"00");}
  const cost=(s.match(/(\d+)\s*(руб|₽)/)||[])[1];
  let what=txt.replace(/(послезавтра|завтра|сегодня|день\s*\d+)/ig,"").replace(/в\s?\d{1,2}([:.\s]\d{2})?\s?(часов|час|ч|утра|вечера|дня)?/ig,"").replace(/\d+\s*(рублей|руб|₽)/ig,"").replace(/\s+/g," ").trim();
  return [{date,time,what:what?what[0].toUpperCase()+what.slice(1):txt,cost:+cost||0}];
}
async function parseVoice(txt){
  const t=trip(), ds=days(t); let items=null;
  if(sampler){ try{ const r=await sampler.json(`Сегодня ${todayS()}. Дни поездки: ${ds.join(", ")||"не указаны"}. Человек продиктовал дела для плана поездки: «${txt}». Разбей на отдельные дела. Для каждого: date (один из дней поездки, ГГГГ-ММ-ДД; «завтра», «в субботу», «на второй день» переводи в дату), time (ЧЧ:ММ или пусто), what (что делать, коротко, с большой буквы), cost (рублей, 0 если не сказано). Ответь только JSON: {"items":[...]}`,{modelTier:"quick"}); items=(r.items||[]).filter(x=>x&&x.what).map(x=>({date:ds.includes(x.date)?x.date:(ds[0]||todayS()),time:String(x.time||""),what:String(x.what),cost:+x.cost||0})); }catch(e){} }
  if(!items||!items.length) items=quickParse(t,txt);
  openDlg(`<h2>${ic("mic")} Добавить в план</h2><form style="display:grid;gap:10px"><p class="muted" style="margin:0">«${esc(txt)}»</p>
    ${items.map((x,i)=>`<div class="grid-f addbox" style="grid-template-columns:1.2fr .8fr 2fr;--c:var(--teal)"><label for="vd${i}">День<select id="vd${i}" name="d${i}">${(ds.length?ds:[x.date]).map((d,k)=>`<option value="${d}" ${d===x.date?"selected":""}>День ${k+1}, ${fmtD(d)}</option>`).join("")}</select></label><label for="vt${i}">Время<input id="vt${i}" name="t${i}" type="time" value="${esc(x.time)}"></label><label for="vw${i}">Что<input id="vw${i}" name="w${i}" value="${esc(x.what)}"></label><input type="hidden" name="c${i}" value="${x.cost}"></div>`).join("")}
    ${btns}</form>`,fd=>{ items.forEach((x,i)=>{ if(!(fd["w"+i]||"").trim()) return; t.plan.push({id:uid(),date:fd["d"+i],time:fd["t"+i]||"",what:fd["w"+i].trim(),cost:(+fd["c"+i]||0),done:false}); }); changed(); toast("Добавлено в план"); },"var(--teal)");
}

  if(b.dataset.mic){ if(vstate.on) stopVoice(true); else startVoice(b.dataset.mic); return; }
  if(b.dataset.vstop){ stopVoice(b.dataset.vstop==="1"); return; }
},true);
function bindDict(){ if(!dict) return; dict.onPartial(({text})=>{vstate.partial=text||""; if(vstate.target==="plan"&&$("#vov")) $("#vov .vtxt").textContent=(vstate.text+" "+vstate.partial).trim()||"Говорите…"; else {const ta=$("#chatIn"); if(ta&&vstate.target==="chat") ta.value=(vstate.text+" "+vstate.partial).trim();}});
  dict.onFinal(({text})=>{vstate.text=(vstate.text+" "+(text||"")).trim(); vstate.partial=""; if(vstate.target==="plan"&&$("#vov")) $("#vov .vtxt").textContent=vstate.text; else {const ta=$("#chatIn"); if(ta) ta.value=vstate.text;}});
  dict.onState(({state})=>{ if(state==="idle"&&vstate.on){ if(vstate.target==="chat"){vstate.on=false; render(); setTimeout(()=>{const ta=$("#chatIn"); if(ta){ta.value=vstate.text; ta.focus();}},30);} } }); }

<h3>1. Кто обрабатывает данные</h3>
<p>Оператор персональных данных: ${opv(OPERATOR.name,"укажите ФИО или название оператора")}. Адрес: ${opv(OPERATOR.address,"укажите адрес")}. Связаться по вопросам данных: ${opv(OPERATOR.email,"укажите e-mail")}.</p>
<p>Политика составлена по статье 18.1 Федерального закона № 152-ФЗ «О персональных данных» в редакции от 26.07.2026. Мы также учитываем права, которые дают пользователям GDPR (для жителей ЕС) и закон Египта № 151/2020 (для жителей Египта).</p>
<h3>2. Какие данные мы обрабатываем</h3>
<ul>
<li><b>Аккаунт:</b> внутренний идентификатор и имя из вашего профиля Claude. Пароли мы не получаем и не храним: вход выполняет Claude.</li>
<li><b>Поездки:</b> города, даты, переезды (номера рейсов и поездов, коды бронирований), жильё и его адреса, план по дням, расходы и бюджет, покупки, список вещей, дневник, задачи подготовки, срок действия загранпаспорта (если вы его указали).</li>

<li><b>Экстренная карточка</b>, если вы её заполнили: страховая, номер полиса, имя и телефон человека для связи.</li>

<p>Мы не собираем специальные категории данных (здоровье, религия, политические взгляды и т. п.) и биометрию. Платежи в приложении не проводятся, данные карт не запрашиваются. Не вносите в заметки сведения о здоровье и не загружайте документы, которые не нужны в поездке.</p>

<ul><li>Хранить и показывать ваши поездки на любом вашем устройстве.</li><li>По вашей команде собирать офлайн-копию поездки: файл сохраняется только на вашем устройстве, приложение его не хранит.</li><li>Совместно планировать с попутчиками, которых вы пригласили сами.</li><li>Подбирать места, маршруты и отвечать на вопросы о поездке (только с вашего отдельного разрешения на ИИ-функции).</li><li>Делать по вашей команде PDF и файл календаря.</li></ul>

<p>Ваше согласие (п. 1 ч. 1 ст. 6 152-ФЗ), оформленное отдельным документом, «Согласием на обработку персональных данных», при первом входе. ИИ-функции включаются отдельным необязательным согласием.</p>
<h3>5. Что мы делаем с данными</h3>
<p>Автоматизированная обработка: сбор, запись, систематизация, накопление, хранение, уточнение, извлечение, использование, предоставление доступа (попутчикам по вашему решению и обработчику из раздела 6), удаление и уничтожение.</p>
<h3>6. Кому передаются данные и где хранятся</h3>
<ul>
<li><b>Anthropic PBC</b> (Сан-Франциско, США). Это платформа, на которой работает приложение: хранение данных и файлов, вход в аккаунт, распознавание голоса и ИИ-помощник Claude. Данные хранятся на серверах за пределами России, то есть это трансграничная передача в страну, которая не входит в перечень стран с адекватной защитой персональных данных. Поэтому мы спрашиваем на это ваше отдельное согласие.</li>
<li><b>Попутчики</b> в общей поездке видят и могут менять всё, что в ней есть: билеты и коды бронирования, план, расходы, вещи, файлы и фото.</li>

<li><b>Сайты бронирования и карт</b> (Авиасейлс, Туту, Яндекс, Booking и др.) открываются только по вашему нажатию. Мы передаём им лишь город и даты в ссылке. Дальше действуют их собственные политики.</li>
</ul>
<p>Помощнику Claude передаются город, даты, число путешественников, бюджет, интересы, переезды, жильё и план выбранной поездки, а также ваш вопрос. При распознавании билета Claude получает только тот файл или текст, который вы сами выбрали; имена пассажиров и номера документов из него в поездку не переносятся. В остальных случаях коды бронирований, файлы, срок паспорта и данные других поездок ему не передаются.</p>
<h3>7. Сколько хранятся</h3>
<p>Пока вы пользуетесь приложением или до отзыва согласия. Кнопка «Отозвать согласие и удалить данные» сразу удаляет ваши поездки, файлы и настройки. По закону срок на это — до 30 дней (ч. 5 ст. 21 152-ФЗ). Общая поездка, созданная другим человеком, остаётся у остальных участников; ваш доступ к ней прекращается. В резервных копиях платформы данные могут храниться ограниченное время по правилам Anthropic. Чтобы подтвердить факт согласия или его отзыва, хранятся только дата, версия документа и ваш идентификатор.</p>
<h3>8. Ваши права</h3>
<ul><li>Узнать, какие данные о вас есть, и получить копию: «Конфиденциальность» → «Скачать мои данные».</li><li>Исправить данные: прямо в приложении.</li><li>Удалить данные и отозвать согласие: «Конфиденциальность» → «Отозвать согласие и удалить данные».</li><li>Включить или выключить ИИ-функции в любой момент.</li><li>Обратиться к оператору по адресу из раздела 1. Ответим в течение 10 рабочих дней (ст. 14, 20 152-ФЗ).</li><li>Обжаловать действия оператора в Роскомнадзоре или в суде.</li></ul>
<h3>9. Как мы защищаем данные</h3>
<ul><li>Ваш личный раздел хранилища недоступен никому, кроме вас, в том числе владельцу приложения.</li><li>Соединение шифруется (HTTPS), вход выполняется через аккаунт Claude.</li><li>Общая поездка хранится в зашифрованном виде (AES-256). Ключ получается из секретного кода приглашения и в хранилище не попадает, поэтому прочитать поездку могут только те, у кого есть код. Храните код в тайне.</li><li>При утечке оператор уведомит Роскомнадзор в течение 24 часов, а о результатах расследования — в течение 72 часов (ч. 3.1 ст. 21 152-ФЗ).</li></ul>
<h3>10. Cookies и данные в браузере</h3>
<p>Cookies и счётчики посещений не используются. В памяти браузера (localStorage) хранятся: язык интерфейса, последняя открытая вкладка, отметка о пройденном обучении и о согласии. Без входа в аккаунт поездки хранятся только в этом браузере. После входа они в браузере не хранятся.</p>
<h3>11. Дети</h3>
<p>Приложение рассчитано на пользователей от 18 лет. Младше 18 — только с согласия родителя или законного представителя.</p>
<h3>12. Данные других людей</h3>
<p>Если вы вносите имена попутчиков или загружаете их документы, получите на это их согласие. Копии чужих паспортов без необходимости лучше не загружать.</p>
<h3>13. Изменения</h3>
<p>При изменении политики мы покажем новую версию и снова попросим согласие. Текущая версия ${POLICY_VER} от ${POLICY_DATE}.</p>`;

function assetIds(t){
  const ids=new Set(); const add=v=>{ if(v&&!String(v).startsWith("data:")) ids.add(String(v)); };
  (t.tripFiles||[]).forEach(f=>add(f.id));
  ["legs","stays","plan","buys"].forEach(k=>(t[k]||[]).forEach(x=>(x.files||[]).forEach(f=>add(f.id))));
  Object.values(t.photos||{}).forEach(add);
  (t.diary||[]).forEach(x=>add(x.photo));
  return [...ids];
}

function importMine(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json"; inp.style.display="none"; document.body.appendChild(inp);
  inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return;
    try{ const d=JSON.parse(await f.text()); const list=Array.isArray(d.trips)?d.trips:[]; if(!list.length) throw new Error("в файле нет поездок");
      let n=0; const have=new Set(S.trips.map(x=>x.id));
      for(const t0 of list){ if(!t0||typeof t0!=="object"||!t0.name) continue; const t=clone(t0); delete t.files; delete t.sharedId; delete t.ownerId; delete t.members;
        ["legs","stays","plan","buys","pack"].forEach(k=>{ if(!Array.isArray(t[k])) t[k]=[]; t[k].forEach(x=>{ if(x&&x.files) delete x.files; }); }); delete t.tripFiles; delete t.photos;
        if(have.has(t.id)) t.id=uid(); have.add(t.id); S.trips.push(t); if(typeof dirty!=="undefined") dirty.add(t.id); n++; }
      if(!n) throw new Error("не удалось прочитать поездки");
      S.current=S.trips[S.trips.length-1].id; closeDlg(); changed(); toast(`Загружено поездок: ${n}`);
    }catch(e){ alertBox("Не получилось загрузить файл: "+(e&&e.message||"ошибка")+". Нужен файл, скачанный кнопкой «Скачать мои данные»."); } };
  inp.click();
}
async function exportMine(){

  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); toast("Файл с данными готов"); }catch(e){ alertBox("Не получилось сохранить файл."); }
}
async function wipeMine(){
  clearTimeout(wt); dirty.clear(); removed.clear();
  Object.keys(subs).forEach(k=>{try{subs[k]();}catch(e){} delete subs[k];});
  const errs=[];
  for(const t of S.trips){
    const mine=!t.sharedId||t.ownerId===myId;
    if(mine && assetsNs){ for(const id of assetIds(t)){ try{await assetsNs.delete(id);}catch(e){} } }
    if(!dbx) continue;
    try{
      if(t.sharedId){ await shPrep(t.sharedId); if(t.ownerId===myId) await shRef(t.sharedId).delete(); else { const m=(t.members||[]).filter(x=>x!==myId); await shRef(t.sharedId).update({members:m}); } }
    }catch(e){ errs.push(t.name); }
  }
  if(dbx){
    try{ const ts=await plannerRef().collection("trips").get(); for(const d of ts.docs){ try{await tripRef(d.id).delete();}catch(e){errs.push(d.id);} } }catch(e){}
    try{ await plannerRef().delete(); }catch(e){}
  }
  try{ [LSKEY,LSKEY+".tab",OB_KEY,"tripplanner.lang"].forEach(k=>localStorage.removeItem(k)); }catch(e){}
  await saveConsent({v:consent&&consent.v||POLICY_VER,withdrawnAt:new Date().toISOString(),ai:false});
  S=clone(DEMO); S.trips.forEach(t=>{t.chat=[];}); closeDlg();
  if(mode==="cloud") mode="consent";
  render();
  alertBox(errs.length?"Почти всё удалено, но часть данных удалить не получилось. Попробуйте ещё раз позже или напишите оператору.":"Согласие отозвано, ваши данные удалены. Чтобы снова пользоваться приложением, нужно дать новое согласие.");
  setTimeout(()=>{ consentGate().then(()=>{ if(dbx&&myId){ mode="cloud"; S=clone(DEMO); S.trips.forEach(t=>dirty.add(t.id)); dirty.add("_meta"); render(); flush(); } }); },400);
}

let pdfLib=null;
async function loadPdfJs(){ if(pdfLib) return pdfLib; await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); const L=window.pdfjsLib; if(!L) throw new Error("pdf"); L.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; pdfLib=L; return L; }
async function pdfRead(file){ const L=await loadPdfJs(); const doc=await L.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise; let text=""; for(let i=1;i<=Math.min(doc.numPages,4);i++){ const pg=await doc.getPage(i); const c=await pg.getTextContent(); text+=c.items.map(x=>x.str).join(" ")+"\n"; }
  let img=null; if(text.replace(/\s/g,"").length<80){ const pg=await doc.getPage(1); const vp=pg.getViewport({scale:1.6}); const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height; await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise; img=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85)); }
  return {text:text.slice(0,20000),img}; }

const ECATS=[["food","Еда и кафе","utensils"],["transport","Транспорт","car"],["stay","Жильё","bed"],["fun","Экскурсии и развлечения","ticket"],["shop","Покупки и сувениры","shopping-bag"],["other","Другое","circle-dot"]];
const ECN=Object.fromEntries(ECATS.map(([k,n])=>[k,n]));
function guessCat(w){ const s=ck(w); if(/ужин|обед|завтрак|кафе|ресторан|кофе|еда|бар|пицц|продукт|магазин еды|перекус|фуд|стрит/.test(s)) return "food"; if(/такси|метро|автобус|поезд|электрич|трансфер|бензин|аренд|самокат|паром|парков|проезд/.test(s)) return "transport"; if(/отел|гостиниц|хостел|квартир|вилл|апарт|жиль/.test(s)) return "stay"; if(/экскурс|музей|билет в|театр|концерт|вход|парк|аквапарк|шоу|тур\b|дайв/.test(s)) return "fun"; if(/сувенир|подарок|одежд|покупк|шопинг|магнит/.test(s)) return "shop"; return "other"; }
function spendChart(t){
  const ex=(t.expenses||[]); if(!ex.length) return "";
  const ds=days(t), tot={}; ECATS.forEach(([k])=>tot[k]=0);
  const byDay={}; ds.forEach(d=>byDay[d]=0); let out=0;
  ex.forEach(e=>{ const a=rubOf(t,e.amount,e.cur); const c=e.cat||guessCat(e.what); tot[c]=(tot[c]||0)+a; if(e.date in byDay) byDay[e.date]+=a; else out+=a; });
  const sum=Object.values(tot).reduce((a,b)=>a+b,0); if(!sum) return "";
  const T=totals(t); const fixed=T.legs+T.stays+T.buysPlan; const n=Math.max(1,ds.length);
  const allow=t.budget?Math.max(0,(t.budget-fixed)/n):0;
  const spentDays=new Set(ex.map(e=>e.date)).size||1; const avg=sum/spentDays; const inTrip=Object.values(byDay).some(v=>v>0);
  const ts=todayS(); const leftDays=ds.filter(d=>d>=ts).length; const rest=t.budget?t.budget-fixed-sum:0;
  const perLeft=leftDays&&t.budget?rest/leftDays:null;
  const cats=ECATS.filter(([k])=>tot[k]>0).sort((a,b)=>tot[b[0]]-tot[a[0]]);
  const maxC=Math.max(...cats.map(([k])=>tot[k]));
  const dv=ds.map(d=>byDay[d]); const maxD=Math.max(1,allow,...dv);
  const H=120, bw=Math.max(10,Math.min(34,Math.floor(560/n)-6));
  const W=n*(bw+6);
  const bars=ds.map((d,i)=>{ const v=byDay[d], h=v?Math.max(4,v/maxD*H):0, over=allow&&v>allow; return `<g class="db"><rect x="${i*(bw+6)}" y="${H-h}" width="${bw}" height="${h}" rx="4" class="${over?"over":""}"><title>День ${i+1}, ${fmtD(d)}: ${rub(v)}${over?" — больше дневного лимита":""}</title></rect><rect x="${i*(bw+6)-3}" y="0" width="${bw+6}" height="${H}" fill="transparent"><title>День ${i+1}, ${fmtD(d)}: ${rub(v)}${over?" — больше дневного лимита":""}</title></rect>${n<=16?`<text x="${i*(bw+6)+bw/2}" y="${H+14}" text-anchor="middle">${i+1}</text>`:""}</g>`; }).join("");
  const lim=allow?`<line x1="-4" x2="${W}" y1="${H-allow/maxD*H}" y2="${H-allow/maxD*H}" class="lim"/><text x="${W}" y="${H-allow/maxD*H-5}" text-anchor="end" class="limt">лимит ${rub(allow)}</text>`:"";
  return `<div class="card accent" style="--c:var(--coral)"><div class="row spread"><h2 class="hic">${ic("chart-bar")}Куда ушли деньги в поездке</h2><span class="muted" style="font-size:13px">по вашим расходам</span></div>
  <div class="kpis"><div><small>Потрачено</small><b class="num">${rub(sum)}</b></div><div><small>В среднем за день</small><b class="num">${rub(avg)}</b></div>${perLeft!=null?`<div><small>Можно тратить в день</small><b class="num" style="color:${perLeft<0?"var(--bad)":"inherit"}">${perLeft<0?"бюджет превышен":rub(perLeft)}</b><span>${leftDays} ${plural(leftDays,"день","дня","дней")} впереди</span></div>`:""}</div>
  <div class="ecats" role="list">${cats.map(([k,nm,icn])=>`<div class="ecat" role="listitem"><span class="nm">${ic(icn)}${nm}</span><div class="bar" title="${nm}: ${rub(tot[k])}"><i style="width:${tot[k]/maxC*100}%"></i></div><span class="num">${rub(tot[k])}</span><span class="pc">${Math.round(tot[k]/sum*100)}%</span></div>`).join("")}</div>
  ${ds.length&&inTrip?`<div class="dchart"><b>По дням поездки</b><div class="dscroll"><svg viewBox="-6 -4 ${W+12} ${H+22}" width="${W+12}" height="${H+22}" role="img" aria-label="Траты по дням поездки">${lim}${bars}<line x1="-4" x2="${W}" y1="${H}" y2="${H}" class="base"/></svg></div>${allow?`<p class="muted" style="margin:0;font-size:12px">Лимит — сколько можно тратить в день, чтобы уложиться в бюджет после билетов, жилья и покупок. Дни выше лимита отмечены тёмным.</p>`:""}${out?`<p class="muted" style="margin:0;font-size:12px">Ещё ${rub(out)} потрачено вне дат поездки.</p>`:""}</div>`:""}
  ${!inTrip&&out?`<p class="muted" style="margin:0;font-size:12px">График по дням появится, когда пойдут траты в даты поездки.</p>`:""}<details class="tblv"><summary>Таблица</summary><table><thead><tr><th scope="col">Категория</th><th scope="col">Сумма</th></tr></thead><tbody>${cats.map(([k,nm])=>`<tr><td>${nm}</td><td class="num">${rub(tot[k])}</td></tr>`).join("")}</tbody></table></details></div>`;
}
document.addEventListener("input",e=>{ if(e.target.id==="ew"){ const s=$("#ecat"); if(s&&!s.dataset.touched) s.value=guessCat(e.target.value); } });
document.addEventListener("change",e=>{ if(e.target.id==="ecat") e.target.dataset.touched=1; });


/* ---------- весь бюджет поездки одной полосой ---------- */
function budgetBar(t){
  const T=totals(t); const ex=(t.expenses||[]).reduce((a,e)=>a+rubOf(t,e.amount,e.cur),0);
  const seg=[["legs","Билеты",T.legs,"plane"],["stays","Жильё",T.stays,"bed"],["plan","План и экскурсии",T.plan,"cal"],["buys","Покупки",T.buysPlan,"cart"],["exp","Траты в поездке",ex,"wallet"]].filter(x=>x[2]>0);
  const used=seg.reduce((a,x)=>a+x[2],0); if(!used&&!t.budget) return "";
  const B=+t.budget||0, base=Math.max(B,used)||1, left=B-used;
  const bar=seg.map(([k,n,v])=>`<i class="bb-${k}" style="flex:${v/base}" title="${n}: ${rub(v)} (${Math.round(v/base*100)}%)"></i>`).join("")+(left>0?`<i class="bb-left" style="flex:${left/base}" title="Свободно: ${rub(left)}"></i>`:"");
  return `<div class="card accent" style="--c:var(--sun)"><div class="row spread"><h2 class="hic">${ic("chart-bar")}Весь бюджет поездки</h2><span class="num" style="font-weight:600">${rub(used)}${B?` из ${rub(B)}`:""}</span></div>
  <div class="bbar" role="img" aria-label="Распределение бюджета: ${seg.map(([k,n,v])=>n+" "+rub(v)).join(", ")}${left>0?", свободно "+rub(left):""}">${bar}</div>
  <div class="bleg" role="list">${seg.map(([k,n,v,icn])=>`<div role="listitem"><span class="sw bb-${k}"></span><span>${n}</span><b class="num">${rub(v)}</b><small>${Math.round(v/(used||1)*100)}%</small></div>`).join("")}${B?`<div role="listitem"><span class="sw bb-left"></span><span>${left>=0?"Свободно":"Сверх бюджета"}</span><b class="num" style="${left<0?"color:var(--bad)":""}">${rub(Math.abs(left))}</b><small></small></div>`:""}</div>
  ${!B?`<p class="muted" style="margin:0;font-size:12px">Укажите бюджет в «Даты и бюджет», и здесь будет видно, сколько осталось.</p>`:""}</div>`;
}

const phTok=s=>{ const out=new Set(); ck(s).replace(/[«»"'“”()\[\].,:;!?—–\-\/]/g," ").split(/\s+/).forEach(w=>{ if(w.length>=3&&!PH_STOP.has(w)) out.add(w.length<=3?w:w.length<=5?w.slice(0,w.length-1):w.slice(0,5)); }); return out; };
function phScore(a,b){ const A=phTok(a), B=phTok(b); if(!A.size||!B.size) return 0; let n=0; A.forEach(x=>{ if(B.has(x)) n++; }); return n/Math.min(A.size,B.size); }

function phBest(dict,name,min){ let best=null, bs=0; for(const k in dict){ const sc=phScore(name,k); if(sc>bs){ bs=sc; best=dict[k]; } } return bs>=min?best:null; }

  if(B&&B[n]) return B[n];
  if(!dest&&PH_ALL[n]) return PH_ALL[n];
  if(B){ const r=phBest(B,name,0.67); if(r) return r; }
  if(WDISH[n]) return WDISH[n];
  const rd=RDISH[n]; if(rd&&WDISH[rd]) return Object.assign([],WDISH[rd],{tag:"Блюдо: "+rd});
  if(dish){ const d=ck(dish).split(" или ")[0]; const r=WDISH[d]||phBest(WDISH,d,0.67); if(r) return Object.assign([],r,{tag:"Блюдо: "+d}); }
  for(const k in WDISH){ if(phScore(k,name)>=1&&phTok(k).size>=1&&ck(name)!==k) return Object.assign([],WDISH[k],{tag:"Блюдо: "+k}); }

});
document.addEventListener("change",e=>{
  const el=e.target; const t=trip(); if(el.closest("#dlg")) return;
  if(el.id==="tripPick"){S.current=el.value; render(); try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(err){} return;}
  if(el.dataset.toggle){const [k,id]=el.dataset.toggle.split(":"); const it=t[k].find(x=>x.id===id); if(k==="buys"){it.bought=el.checked; if(it.bought&&!it.fact) it.fact=it.plan;} else it.done=el.checked; changed(); return;}
  if(el.dataset.fact){const it=t.buys.find(x=>x.id===el.dataset.fact); it.fact=+el.value||0; if(it.fact) it.bought=true; changed();}
});
document.addEventListener("submit",e=>{
  const f=e.target; if(f.closest("#dlg")) return; e.preventDefault(); const t=trip(); const fd=Object.fromEntries(new FormData(f));
  if(f.dataset.addact){t.plan.push({id:uid(),date:f.dataset.addact,time:fd.time||"",what:fd.what.trim(),cost:+fd.cost||0,done:false}); changed(); const n=document.getElementById("w-"+f.dataset.addact); if(n) n.focus();}
  else if(f.id==="addBuy"){t.buys.push({id:uid(),name:fd.name.trim(),cat:fd.cat,plan:+fd.plan||0,cur:fd.cur||"RUB",fact:0,bought:false}); changed(); $("#bn")&&$("#bn").focus();}
  else if(f.id==="addPack"){t.pack.push({id:uid(),group:(fd.group||"Разное").trim(),name:fd.name.trim(),done:false}); changed(); $("#pn")&&$("#pn").focus();}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(h&&h!==tab&&SECT[h]){tab=h;render();}});

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; const t=trip();
  if(b.dataset.itab){itab=b.dataset.itab; render(); return;}
  if(b.dataset.toplan){const [c,i]=b.dataset.toplan.split(":"); toPlanDlg(c,+i); return;}
  if(b.dataset.ai2){runAI2(b.dataset.ai2); return;}
  if(b.dataset.pkind){const k=b.dataset.pkind; if(autoKinds(t).has(k)) {toast("Это определено автоматически по городу, датам и переездам"); return;} t.kinds=t.kinds||[]; t.kinds=t.kinds.includes(k)?t.kinds.filter(x=>x!==k):[...t.kinds,k]; changed(); return;}
  if(b.id==="addPicked"){const picks=[...document.querySelectorAll("[data-sugpick]")].filter(x=>x.checked).map(x=>x.dataset.sugpick.split("|")); picks.forEach(([g,n])=>t.pack.push({id:uid(),group:g,name:n,done:false})); changed(); toast("Добавлено вещей: "+picks.length); return;}
  if(b.id==="acctBtn"){acctDlg(); return;}
});
render();
initCloud().then(()=>{ if(!dbx){ consent=consentLocal(); applyAI(); if(!consentOK()) consentGate(); } });
if(window.claude&&window.claude.use){ window.claude.use("dictation").then(d=>{dictRaw=d||null; if(dictRaw){dict=dictRaw; bindDict(); applyAI(); render();}}).catch(()=>{}); window.claude.use("tts").then(x=>{ttsNs=x||null; if(ttsNs&&tab==="s_phrases") render();}).catch(()=>{}); window.claude.use("downloads").then(d=>{dl=d||null; if(dl) render();}).catch(()=>{}); window.claude.use("assets").then(a=>{assetsNs=a||null;}).catch(()=>{}); window.claude.use("sample").then(sm=>{ if(sm){smRaw=sm; applyAI(); render();} }).catch(()=>{}); }
window.addEventListener("load",()=>paintIcons());
})();</script>
